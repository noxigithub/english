<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Intonation Staircase & Reading Challenge</title>
    <style>
      :root {
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #334155;

        /* Staircase Colors */
        --c-high: #ec4899; /* Pink for stressed */
        --c-low: #94a3b8; /* Gray for unstressed */
        --accent: #3b82f6;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
      }

      .header {
        text-align: center;
        margin-bottom: 30px;
      }

      .header h1 {
        margin: 0;
        font-size: 2.5rem;
        color: #1e293b;
      }
      .header p {
        margin: 10px 0 0;
        color: #64748b;
        font-size: 1.1rem;
      }

      .progress-text {
        margin-top: 15px;
        font-weight: bold;
        color: var(--accent);
        font-size: 1.2rem;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      /* --- STAGE --- */
      .stage {
        background: var(--card-bg);
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
        width: 100%;
        max-width: 900px;
        padding: 40px;
        text-align: center;
        border: 1px solid #e2e8f0;
        min-height: 350px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      /* --- STAIRCASE CONTAINER --- */
      .staircase-box {
        flex-grow: 1;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        background: #f1f5f9;
        padding: 40px 20px;
        border-radius: 15px;
        border: 2px dashed #cbd5e1;
        line-height: 2.8;
        margin-bottom: 30px;
      }

      /* --- FULL TEXT CONTAINER --- */
      .full-text-box {
        display: none;
        flex-grow: 1;
        background: #f8fafc;
        padding: 40px;
        border-radius: 15px;
        border-left: 6px solid var(--accent);
        text-align: left;
        font-size: 1.5rem;
        line-height: 1.8;
        color: #1e293b;
        margin-bottom: 30px;
        box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.02);
      }

      .full-text-title {
        font-size: 1.8rem;
        font-weight: bold;
        color: var(--accent);
        margin-bottom: 20px;
      }

      /* --- RHYTHM WORDS --- */
      .word {
        display: inline-block;
        margin: 0 8px;
        animation: fadeIn 0.5s ease forwards;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Stressed Words (Content) */
      .word.step-up {
        color: var(--c-high);
        font-size: 2.4rem;
        font-weight: 800;
        transform: translateY(-15px);
        text-shadow: 0 4px 6px rgba(236, 72, 153, 0.2);
      }

      /* Unstressed Words (Function) */
      .word.step-down {
        color: var(--c-low);
        font-size: 1.4rem;
        font-weight: 500;
        transform: translateY(10px);
      }

      /* --- CONTROLS --- */
      .controls {
        display: flex;
        justify-content: center;
        gap: 15px;
      }

      .btn-action {
        padding: 16px 35px;
        font-size: 1.2rem;
        font-weight: bold;
        border-radius: 50px;
        border: none;
        cursor: pointer;
        color: white;
        transition: 0.3s;
      }

      .btn-next {
        background: var(--accent);
        box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
      }
      .btn-next:hover {
        background: #2563eb;
        transform: scale(1.05);
      }

      .btn-finish {
        background: #10b981;
        box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
        display: none;
      }
      .btn-finish:hover {
        background: #059669;
        transform: scale(1.05);
      }
    </style>
  </head>

      let currentStoryIndex = 0;

      function loadSentence() {
        const story = database[currentStoryIndex];
        const sentenceData = story.sentences[currentSentenceIndex];

        // Update UI State
        document.getElementById("staircase-box").style.display = "flex";
        document.getElementById("full-text-box").style.display = "none";
        document.getElementById("btn-next").style.display = "block";
        document.getElementById("btn-finish").style.display = "none";
        document.getElementById("progress-text").innerText =
          `Story ${currentStoryIndex + 1} of ${database.length} - Sentence ${currentSentenceIndex + 1}`;

        const box = document.getElementById("staircase-box");
        box.innerHTML = "";

        // Render sentence
        sentenceData.forEach((item, index) => {
          const span = document.createElement("span");
          span.className = `word ${item.stress === 1 ? "step-up" : "step-down"}`;
          span.style.animationDelay = `${index * 0.05}s`;
          span.innerText = item.text;
          box.appendChild(span);
        });
      }

      function handleNext() {
        const story = database[currentStoryIndex];
        currentSentenceIndex++;

        if (currentSentenceIndex >= story.sentences.length) {
          // Sentences finished, show full text
          showFullText(story);
        } else {
          // Load next sentence
          loadSentence();
        }
      }

      function showFullText(story) {
        document.getElementById("staircase-box").style.display = "none";
        document.getElementById("full-text-box").style.display = "block";
        document.getElementById("btn-next").style.display = "none";
        document.getElementById("btn-finish").style.display = "block";
        document.getElementById("progress-text").innerText =
          `Story ${currentStoryIndex + 1} - Reading Challenge`;

        document.getElementById("full-title").innerText = story.title;

        // Reconstruct full paragraph from the data
        let fullText = "";
        story.sentences.forEach((sentence) => {
          let sentenceText = sentence.map((item) => item.text).join(" ");
          // Convertir a capitalización normal (Primera letra mayúscula, resto minúscula)
          sentenceText =
            sentenceText.charAt(0).toUpperCase() +
            sentenceText.slice(1).toLowerCase();
          fullText += sentenceText + " ";
        });

        document.getElementById("full-paragraph").innerText = fullText.trim();
      }

      function nextStory() {
        currentStoryIndex++;
        currentSentenceIndex = 0;

        if (currentStoryIndex >= database.length) {
          currentStoryIndex = 0; // Loop back to the beginning
        }

        loadSentence();
