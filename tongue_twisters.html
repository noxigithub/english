<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Tongue Twister Gym</title>
    <style>
      :root {
        --bg-color: #0f172a;
        --panel-bg: #1e293b;
        --primary: #f59e0b; /* Amber/Orange for Warmup */
        --secondary: #10b981; /* Emerald */
        --accent: #ef4444; /* Red */
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        justify-content: center;
        align-items: center;
      }

      /* --- STAGE --- */
      .stage {
        width: 100%;
        max-width: 800px;
        padding: 20px;
      }

      .card {
        background: var(--panel-bg);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
        border: 2px solid #334155;
        border-top: 5px solid var(--primary);
        text-align: center;
      }

      h1 {
        margin-top: 0;
        font-size: 2.5rem;
        color: var(--primary);
        letter-spacing: 1px;
      }

      .selector-container {
        margin: 20px 0 30px 0;
      }

      select {
        background: #020617;
        color: white;
        border: 2px solid #334155;
        padding: 15px 20px;
        font-size: 1.2rem;
        border-radius: 10px;
        cursor: pointer;
        outline: none;
        width: 100%;
        max-width: 400px;
        font-weight: bold;
      }

      /* --- TWISTER DISPLAY --- */
      .twister-box {
        background: rgba(0, 0, 0, 0.3);
        border: 2px dashed #475569;
        border-radius: 15px;
        padding: 30px;
        min-height: 150px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin-bottom: 30px;
      }

      .target-sound {
        color: var(--secondary);
        font-size: 1.2rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 15px;
        font-weight: bold;
      }

      .twister-text {
        font-size: 2.2rem;
        line-height: 1.4;
        color: var(--text-main);
        font-weight: bold;
        animation: fadeIn 0.4s;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* --- CONTROLS --- */
      .controls {
        display: flex;
        justify-content: center;
        gap: 15px;
      }

      .btn {
        border: none;
        padding: 18px 30px;
        font-size: 1.3rem;
        font-weight: bold;
        border-radius: 12px;
        cursor: pointer;
        transition: 0.2s;
        color: white;
        text-transform: uppercase;
      }

      .btn:active {
        transform: translateY(4px);
        box-shadow: none !important;
      }

      .btn-generate {
        background: #334155;
        box-shadow: 0 5px 0 #0f172a;
        flex: 1;
      }
      .btn-generate:hover {
        background: #475569;
      }

      .btn-challenge {
        background: var(--primary);
        box-shadow: 0 5px 0 #b45309;
        flex: 2;
        color: #000;
      }
      .btn-challenge:hover {
        filter: brightness(1.1);
      }

      /* --- CHALLENGE ANIMATION --- */
      .challenge-mode .twister-box {
        border-color: var(--accent);
        background: rgba(239, 68, 68, 0.1);
      }
      .challenge-mode .twister-text {
        color: var(--accent);
      }

      .pulse-text {
        position: absolute;
        font-size: 8rem;
        color: rgba(255, 255, 255, 0.8);
        pointer-events: none;
        font-weight: bold;
        text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        opacity: 0;
        z-index: 100;
      }

      .pulse-anim {
        animation: pulseHit 1s ease-out forwards;
      }
      @keyframes pulseHit {
        0% {
          transform: scale(0.5);
          opacity: 1;
        }
        100% {
          transform: scale(2);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="pulse-text" id="pulse-indicator">1</div>

    <div class="stage">
      <div class="card" id="main-card">
        <h1>The Warm-Up Gym 👅</h1>
        <p
          style="
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 20px;
          "
        >
          Stretch those facial muscles before speaking!
        </p>

        <div class="selector-container">
          <select id="category" onchange="generateTwister()">
            <option value="th">🎯 The "TH" Sound (Thought, The)</option>
            <option value="vb">🎯 The "V" vs "B" (Very, Big)</option>
            <option value="s">🎯 The "S" Blends (Stop, Smart)</option>
            <option value="ih">🎯 Short "I" vs Long "E" (Sit vs Seat)</option>
            <option value="texas">🤠 Au Pair & Texas Edition</option>
          </select>
        </div>

        <div class="twister-box" id="twister-box">
          <div class="target-sound" id="target-sound">Target: TH Sound</div>
          <div class="twister-text" id="twister-text">
            I thought a thought, but the thought I thought wasn't the thought I
            thought I thought.
          </div>
        </div>

        <div class="controls">
          <button class="btn btn-generate" onclick="generateTwister()">
            🎲 NEW TWISTER
          </button>
          <button
            class="btn btn-challenge"
            id="btn-challenge"
            onclick="startChallenge()"
          >
            ⚡ 3X SPEED CHALLENGE
          </button>
        </div>
      </div>
    </div>

    <script>
      const twisters = {
        th: [
          "I thought a thought, but the thought I thought wasn't the thought I thought I thought.",
          "They threw three free throws.",
          "The thirty-three thieves thought that they thrilled the throne throughout Thursday.",
          "This is the sixth zebra snoozing thoroughly.",
          "Father, mother, sister, brother, hand in hand with one another.",
        ],
        vb: [
          "Victor vows to bake a very big vanilla cake.",
          "A big black bug bit a big black bear, but the big black bear bit the big black bug back.",
          "Vincent views the vast valley very vividly.",
          "Valerie's vacuum vividly vanishes big bags of vegetables.",
          "Vampires rarely value a very vibrant blood bank.",
        ],
        s: [
          "Steve snatches stupid spiders.",
          "Six sleek swans swam swiftly southwards.",
          "I saw Susie sitting in a shoeshine shop.",
          "A smart snake sneaked slowly past the stairs.",
          "Stop standing by the store and start stepping!",
        ],
        ih: [
          "He feels his feet in the deep green sea.",
          "Six sticky skeletons sat on a single seat.",
          "Tim bit a bit of the big peach, but the peach was a bit bitter.",
          "The sheep in the ship slipped and hit its hip.",
          "Please fix these six big split peas.",
        ],
        texas: [
          "The tall Texan took two toddlers to the town.",
          "Host Dad cooks hot dogs on the hot Texas grill.",
          "Ten tiny toddlers threw their toys toward the truck.",
          "The Au Pair packed a pair of purple pants for the park.",
          "Can a cowboy catch a cow in a crazy Texas canyon?",
        ],
      };

      function generateTwister() {
        const cat = document.getElementById("category").value;
        const pool = twisters[cat];
        const randomTwister = pool[Math.floor(Math.random() * pool.length)];

        const targetText =
          document.getElementById("category").options[
            document.getElementById("category").selectedIndex
          ].text;
        document.getElementById("target-sound").innerText = targetText;

        const textBox = document.getElementById("twister-text");
        textBox.style.animation = "none";
        void textBox.offsetWidth; // trigger reflow
        textBox.style.animation = "fadeIn 0.4s";
        textBox.innerText = randomTwister;
      }

      function startChallenge() {
        const btn = document.getElementById("btn-challenge");
        const card = document.getElementById("main-card");
        const pulse = document.getElementById("pulse-indicator");

        btn.disabled = true;
        card.classList.add("challenge-mode");

        let count = 1;

        // Initial hit
        triggerPulse(count, pulse);

        const interval = setInterval(() => {
          count++;
          if (count <= 3) {
            triggerPulse(count, pulse);
          } else {
            clearInterval(interval);
            setTimeout(() => {
              card.classList.remove("challenge-mode");
              btn.disabled = false;
            }, 1000);
          }
        }, 2500); // 2.5 seconds per read
      }

      function triggerPulse(num, element) {
        element.innerText = num;
        element.classList.remove("pulse-anim");
        void element.offsetWidth;
        element.classList.add("pulse-anim");
      }

      // Init
      generateTwister();
    </script>
  </body>
</html>
