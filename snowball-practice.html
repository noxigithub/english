    <style>
      :root {
        --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        --card-bg: rgba(255, 255, 255, 0.9);

        /* Grammar Colors */
        --c-base: #3b82f6; /* Blue for base subject */
        --c-what: #ec4899; /* Pink for What/Action */
        --c-where: #10b981; /* Green for Where */
        --c-when: #f59e0b; /* Orange for When */
        --c-why: #8b5cf6; /* Purple for Why */

        --text-main: #334155;
        --text-muted: #94a3b8;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: var(--bg-gradient);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .header {
        text-align: center;
        margin-bottom: 20px;
      }

      .header h1 {
        margin: 0;
        font-size: 2.5rem;
        color: #475569;
      }
      .header p {
        margin: 5px 0 0;
        color: var(--text-muted);
        font-size: 1.1rem;
      }

      /* --- PILL NAVIGATION --- */
      .pills-container {
        display: flex;
        gap: 12px;
        margin-bottom: 30px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .pill-btn {
        background: white;
        border: 2px solid #cbd5e1;
        padding: 10px 20px;
        border-radius: 50px;
        font-size: 1rem;
        font-weight: bold;
        color: var(--text-muted);
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
      }

      .pill-btn:hover {
        border-color: #94a3b8;
        transform: translateY(-2px);
      }

      .pill-btn.active {
        background: #475569;
        color: white;
        border-color: #475569;
        box-shadow: 0 6px 12px rgba(71, 85, 105, 0.2);
      }

      /* --- MAIN STAGE --- */
      .stage {
        background: var(--card-bg);
        border-radius: 25px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
        width: 100%;
        max-width: 800px;
        padding: 40px;
        text-align: center;
        border: 1px solid #e2e8f0;
      }

      /* --- SENTENCE DISPLAY --- */
      .sentence-box {
        background: #f8fafc;
        border: 2px dashed #cbd5e1;
        border-radius: 15px;
        min-height: 120px;
        padding: 25px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        justify-content: center;
        margin-bottom: 30px;
        font-size: 1.8rem;
        font-weight: bold;
        line-height: 1.5;
      }

      .chunk {
        padding: 5px 12px;
        border-radius: 8px;
        opacity: 0;
        transform: scale(0.9);
        animation: popIn 0.4s forwards;
        color: white;
      }

      @keyframes popIn {
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .c-base {
        background: var(--c-base);
      }
      .c-what {
        background: var(--c-what);
      }
      .c-where {
        background: var(--c-where);
      }
      .c-when {
        background: var(--c-when);
      }
      .c-why {
        background: var(--c-why);
      }

      /* --- PROMPT AREA --- */
      .prompt-area {
        margin-bottom: 30px;
        min-height: 150px;
      }

      .question-label {
        font-size: 1.4rem;
        font-weight: bold;
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 2px;
        transition: color 0.3s;
      }

      .options-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
      }

      .opt-btn {
        background: white;
        border: 2px solid #cbd5e1;
        padding: 15px 25px;
        border-radius: 50px;
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--text-main);
        cursor: pointer;
        transition: 0.2s;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
      }

      .opt-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 15px rgba(0, 0, 0, 0.05);
        border-color: #94a3b8;
      }

      /* --- CONTROLS --- */
      .controls {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 20px;
      }

      .btn-main {
        padding: 15px 35px;
        font-size: 1.2rem;
        font-weight: bold;
        border-radius: 50px;
        border: none;
        cursor: pointer;
        color: white;
        transition: 0.3s;
      }

      .btn-flow {
        background: #10b981;
        box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
        display: none;
      }
      .btn-flow:hover {
        background: #059669;
        transform: scale(1.05);
      }

      .btn-next {
        background: #3b82f6;
        box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
        display: none;
      }
      .btn-next:hover {
        background: #2563eb;
        transform: scale(1.05);
      }
    </style>
  </head>

            base: { text: "We will take", type: "c-base" },
            steps: [
              {
                q: "+ WHAT?",
                type: "c-what",
                correct: "a long walk",
                distractors: ["at the park", "when the sun goes down"],
              },
              {
                q: "+ WHERE?",
                type: "c-where",
                correct: "at the park",
                distractors: ["a long walk", "when the sun goes down"],
              },
              {
                q: "+ WHEN?",
                type: "c-when",
                correct: "when the sun goes down.",
                distractors: ["at the park", "a long walk"],
              },
            ],
          },
          {
            base: { text: "I am gonna organize", type: "c-base" },
            steps: [
              {
                q: "+ WHAT?",
                type: "c-what",
                correct: "my study desk",
                distractors: ["tomorrow", "so I can focus better"],
              },
              {
                q: "+ WHEN?",
                type: "c-when",
                correct: "tomorrow",
                distractors: ["my study desk", "so I can focus better"],
              },
              {
                q: "+ WHY?",
                type: "c-why",
                correct: "so I can focus better.",
                distractors: ["tomorrow", "my study desk"],
              },
            ],
          },
        ],
      };

      // Create the Mixed category dynamically (10 + 10 + 10 = 30)
      database.mixed = [
        ...database.present,
        ...database.past,
        ...database.future,
      ];

      let currentCategory = "present";
      let activeExercises = [];
      let currentExIndex = 0;
      let currentStepIndex = 0;

      function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
      }

      function setCategory(category, btnElement) {
        // Update Active Pill
        document
          .querySelectorAll(".pill-btn")
          .forEach((btn) => btn.classList.remove("active"));
        btnElement.classList.add("active");

        // Setup Data
        currentCategory = category;
        activeExercises = shuffle([...database[currentCategory]]);
        currentExIndex = 0;

        loadNextExercise();
      }

      function loadNextExercise() {
        // Reset UI
        document.getElementById("sentence-box").innerHTML = "";
        document.getElementById("btn-next").style.display = "none";
        document.getElementById("btn-flow").style.display = "none";
        document.getElementById("prompt-area").style.display = "block";

        currentStepIndex = 0;

        if (currentExIndex >= activeExercises.length) {
          // Reshuffle if we reached the end
          activeExercises = shuffle([...database[currentCategory]]);
          currentExIndex = 0;
        }

        const ex = activeExercises[currentExIndex];

        // Add base chunk
        addChunk(ex.base.text, ex.base.type);

        // Load first step
        loadStep();
      }

      function addChunk(text, typeClass) {
        const box = document.getElementById("sentence-box");
        const span = document.createElement("span");
        span.className = `chunk ${typeClass}`;
        span.innerText = text;
        box.appendChild(span);
      }

      function loadStep() {
        const ex = activeExercises[currentExIndex];

        if (currentStepIndex >= ex.steps.length) {
          // Exercise complete
          document.getElementById("prompt-area").style.display = "none";
          document.getElementById("btn-flow").style.display = "block";
          return;
        }

        const step = ex.steps[currentStepIndex];

        // Set Question Label and Color
        const qLabel = document.getElementById("question-label");
        qLabel.innerText = step.q;
        qLabel.style.color = `var(--${step.type})`;

        // Generate Buttons
        const container = document.getElementById("options-container");
        container.innerHTML = "";

        let options = [step.correct, ...step.distractors];
        options = shuffle(options);

        options.forEach((optText) => {
          const btn = document.createElement("button");
          btn.className = "opt-btn";
          btn.innerText = optText;
          btn.onclick = () =>
            handleSelection(btn, optText, step.correct, step.type);
          container.appendChild(btn);
        });
      }

      function handleSelection(btn, selectedText, correctText, typeClass) {
        if (selectedText === correctText) {
          // Correct!
          addChunk(correctText, typeClass);
          currentStepIndex++;
          loadStep();
        } else {
          // Wrong - visual shake
          btn.style.animation = "shake 0.4s";
          btn.style.borderColor = "#ef4444";
          btn.style.color = "#ef4444";
          setTimeout(() => {
            btn.style.animation = "none";
            btn.style.borderColor = "#cbd5e1";
            btn.style.color = "var(--text-main)";
          }, 400);
        }
      }

      function flowSentence() {
        // Remove colored backgrounds to make it look like a natural sentence
        const chunks = document.querySelectorAll(".chunk");
        chunks.forEach((chunk) => {
          chunk.style.background = "transparent";
          chunk.style.color = "var(--text-main)";
          chunk.style.padding = "0 5px";
        });

        document.getElementById("btn-flow").style.display = "none";
        document.getElementById("btn-next").style.display = "block";

        // Move to next exercise index for the next click
        currentExIndex++;
      }

      // CSS animation dynamically added for shake
      const style = document.createElement("style");
      style.innerHTML = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-5px); }
                75% { transform: translateX(5px); }
            }
        `;
      document.head.appendChild(style);

      // Init App
      activeExercises = shuffle([...database["present"]]);
      loadNextExercise();
    </script>
  </body>
</html>
