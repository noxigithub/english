<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Social Glue - Casual Conversations</title>
    <style>
      :root {
        --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        --card-bg: rgba(255, 255, 255, 0.95);

        --c-text: #334155;
        --c-muted: #94a3b8;
        --c-glue: #f59e0b; /* Orange for the Connector/Glue */
        --c-bubble1: #3b82f6; /* Blue for part 1 */
        --c-bubble2: #10b981; /* Green for part 2 */

        --success: #10b981;
        --error: #ef4444;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: var(--bg-gradient);
        color: var(--c-text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
      }

      .header {
        text-align: center;
        margin-bottom: 30px;
      }

      .header h1 {
        margin: 0;
        font-size: 2.5rem;
        color: #1e293b;
        letter-spacing: 0.5px;
      }
      .header p {
        margin: 8px 0 0;
        color: var(--c-muted);
        font-size: 1.1rem;
      }

      /* --- STAGE --- */
      .stage {
        background: var(--card-bg);
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06);
        width: 100%;
        max-width: 800px;
        padding: 40px;
        text-align: center;
        border: 1px solid #f1f5f9;
      }

      /* --- SITUATION BANNER --- */
      .situation-banner {
        background: #f8fafc;
        border-left: 5px solid var(--c-glue);
        padding: 15px 20px;
        border-radius: 10px;
        margin-bottom: 30px;
        font-size: 1.1rem;
        color: #475569;
        text-align: left;
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .situation-icon {
        font-size: 2rem;
      }

      /* --- CONVERSATION BOX --- */
      .convo-box {
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin-bottom: 40px;
        align-items: center;
      }

      .speech-bubble {
        padding: 15px 25px;
        border-radius: 20px;
        font-size: 1.4rem;
        font-weight: bold;
        color: white;
        max-width: 80%;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition: all 0.3s;
      }

      .bubble-1 {
        background: var(--c-bubble1);
        align-self: flex-start;
        border-bottom-left-radius: 5px;
      }
      .bubble-2 {
        background: var(--c-bubble2);
        align-self: flex-end;
        border-bottom-right-radius: 5px;
      }

      /* The Glue Slot */
      .glue-slot {
        padding: 10px 30px;
        border-radius: 50px;
        border: 3px dashed #cbd5e1;
        color: var(--c-muted);
        font-size: 1.2rem;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 2px;
        background: white;
        transition: all 0.3s;
        margin: 10px 0;
        min-height: 25px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .glue-slot.filled {
        background: var(--c-glue);
        border: 3px solid var(--c-glue);
        color: white;
        text-transform: none;
        letter-spacing: normal;
        font-size: 1.5rem;
        box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3);
      }

      /* --- OPTIONS --- */
      .prompt-area {
        min-height: 120px;
      }

      .question-label {
        font-size: 1.1rem;
        font-weight: bold;
        margin-bottom: 20px;
        color: #64748b;
      }

      .options-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
      }

      .opt-btn {
        background: white;
        border: 2px solid #cbd5e1;
        padding: 12px 25px;
        border-radius: 12px;
        font-size: 1.2rem;
        font-weight: bold;
        color: var(--c-text);
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .opt-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.05);
        border-color: var(--c-glue);
        color: var(--c-glue);
      }

      /* --- CONTROLS --- */
      .controls {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 20px;
      }

      .btn-main {
        padding: 15px 35px;
        font-size: 1.2rem;
        font-weight: bold;
        border-radius: 50px;
        border: none;
        cursor: pointer;
        color: white;
        transition: 0.3s;
        display: none;
      }

      .btn-flow {
        background: var(--c-glue);
        box-shadow: 0 5px 15px rgba(245, 158, 11, 0.3);
      }
      .btn-flow:hover {
        background: #d97706;
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>The Social Glue ☕💬</h1>
      <p>Connect your ideas and sound completely natural.</p>
    </div>

    <div class="stage">
      <div class="situation-banner" id="situation-banner">
        <div class="situation-icon" id="situation-icon">☕</div>
        <div>
          <strong>Intention:</strong>
          <span id="situation-text">Loading...</span>
        </div>
      </div>

      <div class="convo-box">
        <div class="speech-bubble bubble-1" id="part-1">Part 1</div>
        <div class="glue-slot" id="glue-slot">[ Choose the connector ]</div>
        <div class="speech-bubble bubble-2" id="part-2">Part 2</div>
      </div>

      <div class="prompt-area" id="prompt-area">
        <div class="question-label" id="question-label">
          What is the best way to connect these thoughts?
        </div>
        <div class="options-container" id="options-container">
          <!-- Buttons injected here -->
        </div>
      </div>

      <div class="controls">
        <button
          class="btn-main btn-flow"
          id="btn-flow"
          onclick="loadNextExercise()"
        >
          ✨ Next Chat
        </button>
      </div>
    </div>

    <script>
      // Data Structure: Social Scenarios & Connectors
      const exercises = [
        {
          icon: "🔄",
          intention:
            "You remember something unrelated and want to change the subject smoothly.",
          part1: "The movie last night was really good.",
          part2: "did you finish the homework for English class?",
          correct: "By the way,",
          distractors: ["To be honest,", "Therefore,"],
        },
        {
          icon: "🤫",
          intention:
            "You want to say the truth, even if it's a little bit negative.",
          part1: "Everyone says Austin is amazing.",
          part2: "I think it's too hot for me.",
          correct: "To be honest,",
          distractors: ["By the way,", "Anyway,"],
        },
        {
          icon: "🏁",
          intention:
            "You finished a long story and want to summarize or wrap it up.",
          part1: "...and then we waited in traffic for two hours.",
          part2: "we finally got home and went straight to sleep.",
          correct: "Anyway,",
          distractors: ["Actually,", "By the way,"],
        },
        {
          icon: "💡",
          intention: "You want to correct a misunderstanding politely.",
          part1: "Oh, you are from Mexico, right?",
          part2: "I'm from Colombia.",
          correct: "Actually,",
          distractors: ["Anyway,", "So,"],
        },
        {
          icon: "🎯",
          intention: "You want to express a logical consequence or result.",
          part1: "I didn't sleep well last night.",
          part2: "I'm going to buy a large coffee.",
          correct: "So,",
          distractors: ["By the way,", "Actually,"],
        },
        {
          icon: "⏳",
          intention:
            "You need a second to think before answering a personal question.",
          part1: "What do you miss the most about your country?",
          part2: "I think I miss the food the most.",
          correct: "Well, you know,",
          distractors: ["Anyway,", "Therefore,"],
        },
        {
          icon: "➕",
          intention: "You want to add more information to support your point.",
          part1: "I really like my schedule this week.",
          part2: "I have the whole weekend free.",
          correct: "Plus,",
          distractors: ["However,", "Anyway,"],
        },
      ];

      let activeExercises = [];
      let currentExIndex = 0;

      function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
      }

      function loadNextExercise() {
        // Reset UI
        document.getElementById("glue-slot").classList.remove("filled");
        document.getElementById("glue-slot").innerText =
          "[ Choose the connector ]";
        document.getElementById("prompt-area").style.display = "block";
        document.getElementById("btn-flow").style.display = "none";

        if (
          activeExercises.length === 0 ||
          currentExIndex >= activeExercises.length
        ) {
          activeExercises = shuffle([...exercises]);
          currentExIndex = 0;
        }

        const ex = activeExercises[currentExIndex];

        // Set Text
        document.getElementById("situation-icon").innerText = ex.icon;
        document.getElementById("situation-text").innerText = ex.intention;
        document.getElementById("part-1").innerText = ex.part1;
        document.getElementById("part-2").innerText = ex.part2;

        // Generate Buttons
        const container = document.getElementById("options-container");
        container.innerHTML = "";

        let options = [ex.correct, ...ex.distractors];
        options = shuffle(options);

        options.forEach((optText) => {
          const btn = document.createElement("button");
          btn.className = "opt-btn";
          btn.innerText = optText;
          btn.onclick = () => handleSelection(btn, optText, ex.correct);
          container.appendChild(btn);
        });
      }

      function handleSelection(btn, selectedText, correctText) {
        if (selectedText === correctText) {
          // Correct
          const slot = document.getElementById("glue-slot");
          slot.innerText = correctText;
          slot.classList.add("filled");

          document.getElementById("prompt-area").style.display = "none";
          document.getElementById("btn-flow").style.display = "block";

          currentExIndex++;
        } else {
          // Wrong
          btn.style.animation = "shake 0.4s";
          btn.style.borderColor = "var(--error)";
          btn.style.color = "var(--error)";
          setTimeout(() => {
            btn.style.animation = "none";
            btn.style.borderColor = "#cbd5e1";
            btn.style.color = "var(--c-text)";
          }, 400);
        }
      }

      // CSS animation dynamically added for shake
      const style = document.createElement("style");
      style.innerHTML = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-5px); }
                75% { transform: translateX(5px); }
            }
        `;
      document.head.appendChild(style);

      // Init App
      loadNextExercise();
    </script>
  </body>
</html>
